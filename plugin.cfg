# kiln-tailscale: Fluidd and Moonraker from your own tailnet (README.md).
# Tailscale runs in Moonraker's part of the plugin (moonraker.conf,
# moonraker/components/kiln_tailscale.py); these macros only pass the
# console's commands to it.

[gcode_macro KILN_TAILSCALE_STATUS]
description: Tailscale: connected or not, the tailnet address, the login link
gcode:
  {action_call_remote_method("kiln_tailscale_status")}

[gcode_macro KILN_TAILSCALE_LOGIN]
description: Tailscale: log in again (new login link), also after a logout or the out-of-memory switch-off
gcode:
  {action_call_remote_method("kiln_tailscale_login")}

[gcode_macro KILN_TAILSCALE_LOGOUT]
description: Tailscale: log this printer out of the tailnet and stop Tailscale
gcode:
  {action_call_remote_method("kiln_tailscale_logout")}
