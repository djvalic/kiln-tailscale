# kiln-tailscale's Moonraker part (Kiln OS includes it while the plugin is
# on, after your moonraker.conf). It runs tailscaled and shows the login
# link in Fluidd's notifications and console.

# Options (README.md): allow_low_memory, hostname, login_server,
# memory_limit, state_dir, socket, binary. Set them in a [kiln_tailscale]
# section of your own moonraker.conf; this one stays empty so yours count.
[kiln_tailscale]

[update_manager kiln-tailscale]
type: git_repo
path: /data/ad5x/plugins/tailscale
origin: https://github.com/djvalic/kiln-tailscale.git
primary_branch: main
is_system_service: False
# A new tailscaled or component runs after Moonraker restarts
managed_services: moonraker
